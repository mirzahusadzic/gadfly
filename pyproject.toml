[project]
name = "gadfly"
version = "0.1.0"
description = "Counterfactual load-bearing tests: situate a relation, intervene, observe, read the verdict by fixed rules."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = []

[project.scripts]
gadfly = "gadfly.cli:main"

[project.urls]
Repository = "https://github.com/mirzahusadzic/gadfly"

[build-system]
requires = ["hatchling>=1.27"]  # license expressions (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
addopts = "--cov=gadfly --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
# docs/ holds the site's pages and its VitePress theme.
extend-exclude = ["docs"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
