[project]
name = "midwife"
version = "0.5.0"
description = "Test whether a decision rests on the evidence you think it does: cut or change one declared line in fixed ways, ask again, and read the verdict by fixed rules."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = []
keywords = ["llm-evaluation", "ablation", "counterfactual", "grounding", "context-attribution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
gadfly = "midwife.cli:main"

[project.urls]
Documentation = "https://mirzahusadzic.github.io/gadfly/"
Repository = "https://github.com/mirzahusadzic/gadfly"
Issues = "https://github.com/mirzahusadzic/gadfly/issues"
Troubleshooting = "https://mirzahusadzic.github.io/gadfly/troubleshooting"

[build-system]
requires = ["hatchling>=1.27"]  # license expressions (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
addopts = "--cov=midwife --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
# docs/ holds the site's pages and its VitePress theme.
extend-exclude = ["docs"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
