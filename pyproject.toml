[project]
name = "gadfly"
version = "0.1.0"
description = "Counterfactual load-bearing tests: situate a relation, intervene, observe, read the verdict by fixed rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14"]

[tool.pytest.ini_options]
addopts = "--cov=gadfly --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
