[project]
name = "gadfly"
version = "0.1.0"
description = "Counterfactual load-bearing tests: situate a relation, intervene, observe, read the verdict by fixed rules."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = []

[project.scripts]
gadfly = "gadfly.cli:main"

[project.urls]
Repository = "https://github.com/mirzahusadzic/gadfly"

[build-system]
requires = ["hatchling>=1.27"]  # license expressions (PEP 639)
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14"]
# MkDocs 2 drops the plugin system mkdocstrings needs.
docs = ["mkdocs>=1.6,<2", "mkdocs-material==9.7.7", "mkdocstrings-python==2.0.9"]

[tool.pytest.ini_options]
addopts = "--cov=gadfly --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# docs/ holds snippet directives in its code blocks; site/ is built output.
extend-exclude = ["docs", "site"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
