site_name: Gadfly
site_description: Counterfactual load-bearing tests over a declared frame.
copyright: Apache-2.0

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light}

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Framework: framework.md
  - Batteries: batteries.md
  - Examples: examples.md
  - Reference: reference.md

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        # Not "mermaid": Material would draw it without the elk layout.
        - name: mermaid
          class: mermaid-house
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            heading_level: 2

extra_css:
  - stylesheets/house.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - path: javascripts/mermaid-house.mjs
    type: module
